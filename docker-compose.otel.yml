# Megatron-LM observability stack — Jaeger + Prometheus + Grafana
#
# Usage:
#   docker compose -f docker-compose.otel.yml up -d
#
# Then bash into the Megatron container to run training:
#   docker compose -f docker-compose.otel.yml exec megatron bash
#
# UIs:
#   Jaeger   http://localhost:16686
#   Grafana  http://localhost:3000  (anonymous admin, no login required)
#   Prometheus http://localhost:9090  (optional, for ad-hoc queries)
#
# Architecture:
#   Megatron ──OTLP traces──► Jaeger v2 (natively accepts OTLP)
#   Megatron ──OTLP metrics──► OTel Collector ──► Prometheus ──► Grafana

services:

  # ── Megatron-LM training container ─────────────────────────────────────────
  # Interactive container for running training with OTel enabled.
  # Traces go to Jaeger, metrics go to the OTel Collector.
  megatron:
    image: local-megatron-lm:otel-compose
    build:
      context: .
      dockerfile_inline: |
        FROM local-megatron-lm:otel
        RUN pip install --no-cache-dir \
            'opentelemetry-api~=1.39.1' \
            'opentelemetry-sdk>=1.39.1' \
            'opentelemetry-exporter-otlp-proto-grpc>=1.39.1'
    volumes:
      - .:/mlm
    working_dir: /mlm
    environment:
      - MEGATRON_OTEL_ENABLED=1
      - OTEL_METRIC_EXPORT_INTERVAL=1000
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://jaeger:4317
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://otel-collector:4317
      - MEGATRON_OTEL_SPAN_GROUPS=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    stdin_open: true
    tty: true
    networks:
      - otel-net
    depends_on:
      jaeger:
        condition: service_started
      otel-collector:
        condition: service_started

  # ── Jaeger v2 ──────────────────────────────────────────────────────────────
  # Trace storage and search UI.  Jaeger v2 natively accepts OTLP — no
  # separate collector needed for the trace pipeline.
  jaeger:
    image: jaegertracing/jaeger:2.15.0
    command: ["--config", "/etc/jaeger/config.yaml"]
    volumes:
      - ./observability/jaeger.yaml:/etc/jaeger/config.yaml:ro
    ports:
      - "16686:16686"   # Jaeger UI
    networks:
      - otel-net
    restart: unless-stopped

  # ── OpenTelemetry Collector ────────────────────────────────────────────────
  # Handles the metrics pipeline: receives OTLP metrics from Megatron,
  # exposes a Prometheus scrape endpoint.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.146.0
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "8889:8889"   # Prometheus scrape endpoint (metrics)
    networks:
      - otel-net
    restart: unless-stopped

  # ── Prometheus ─────────────────────────────────────────────────────────────
  # Scrapes the collector's Prometheus endpoint and stores time-series data.
  prometheus:
    image: prom/prometheus:v3.10.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"          # allows hot-reload: POST /-/reload
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"   # Prometheus UI — useful for writing/testing PromQL
    networks:
      - otel-net
    restart: unless-stopped
    depends_on:
      - otel-collector

  # ── Grafana ────────────────────────────────────────────────────────────────
  # Unified dashboard — pre-wired to Prometheus (metrics) and Jaeger (traces).
  grafana:
    image: grafana/grafana:12.4.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceToMetrics
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - otel-net
    restart: unless-stopped
    depends_on:
      - prometheus
      - jaeger

volumes:
  prometheus_data:
  grafana_data:

networks:
  otel-net:
    driver: bridge
